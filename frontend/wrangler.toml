name = "travel-planner"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
# Cloudflare Pages: next-on-pages writes the deployable site here
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "travel_planner_db"
database_id = "1f2a2fdd-fdc5-436b-905e-5d97dc2fbba8"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "ATTACHMENTS_BUCKET"
bucket_name = "travel-planner-attachments"
